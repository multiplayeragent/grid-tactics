<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grid Tactics</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1d2a22; }
  body { font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f4f1ea; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  #top { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 4px; border-radius: 999px;
         background: #0d1712d9; white-space: nowrap; pointer-events: none; width: min(520px, calc(100vw - 16px)); box-sizing: border-box; }
  .side { flex: 1 1 0; display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 999px; min-width: 0; transition: box-shadow .25s; }
  .side.r { flex-direction: row-reverse; padding: 3px 4px 3px 10px; }
  .side.turn { box-shadow: 0 0 0 2px var(--c), 0 0 14px var(--c); }
  .side .sw { width: 26px; height: 26px; border-radius: 50%; background: var(--c); flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 800; }
  .side .nm { font-weight: 700; font-size: 13px; min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .side .gold { font-size: 13px; color: #ffd166; font-weight: 800; }
  .side .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
  #day { font-weight: 800; font-size: 13px; text-align: center; min-width: 58px; line-height: 1.15; }
  #day small { display: block; font-weight: 600; opacity: .7; font-variant-numeric: tabular-nums; }
  #panel { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(6px, env(safe-area-inset-bottom)) + 18px); width: min(620px, calc(100vw - 16px)); box-sizing: border-box;
           min-height: 104px; padding: 8px 10px; border-radius: 16px; background: #0d1712e6; border: 1px solid #ffffff1f; }
  #info { font-size: 13px; opacity: .9; min-height: 34px; }
  #acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  #acts button { min-height: 44px; padding: 0 12px; border-radius: 12px; border: 0; background: #2d4a39; color: #fff; font: 700 14px system-ui, sans-serif; cursor: pointer; }
  #acts button small { color: #ffd166; font-weight: 700; margin-left: 4px; }
  #acts button:disabled { opacity: .4; cursor: default; }
  #acts #end { margin-left: auto; background: #ffd166; color: #2a1d00; }
  #acts #end.pulse { animation: glow 1s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 5px #ffd16666; } }
  #banner { position: fixed; top: 38%; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: 900; text-shadow: 0 3px 0 #0007, 0 0 18px #000a; pointer-events: none; opacity: 0;
            transition: opacity .35s; }
  #net { position: fixed; bottom: max(3px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; opacity: .7; pointer-events: none; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0008; }
  #over[hidden], #panel[hidden] { display: none; }
  .card { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 18px; background: #16241b; border: 1px solid #ffffff22; text-align: center; }
  .card h2 { margin: 0; font-size: 26px; } .card p { margin: 4px 0 12px; opacity: .85; }
  .card h3 { margin: 8px 0 4px; font-size: 13px; color: #ffd166; text-align: left; }
  .card ol { text-align: left; margin: 0 0 12px; padding-left: 24px; font-size: 14px; min-height: 24px; } .card li span { float: right; }
  .card button { width: 100%; min-height: 48px; border-radius: 12px; border: 0; font: 700 16px system-ui, sans-serif; cursor: pointer; margin-top: 8px; }
  #again { background: #ffd166; color: #2a1d00; } #look { background: #ffffff1a; color: #fff; }
  .hide { display: none !important; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div id="top"><div class="side" id="s0"></div><div id="day"></div><div class="side r" id="s1"></div></div>
<div id="banner"></div>
<div id="panel" hidden><div id="info"></div><div id="acts"></div></div>
<div id="net">Connecting…</div>
<div id="over" hidden><div class="card">
  <h2 id="overTitle"></h2><p id="overWhy"></p>
  <h3>Most wins</h3><ol id="board"><li>Loading…</li></ol>
  <button id="again">Play again</button><button id="look">Look at the map</button>
</div></div>
<script>
/* ═══ GRID TACTICS · a Multiplayer Agent starter ══════════════════════════════════════════
 * Move infantry, tanks and artillery on a small map, fight, and capture buildings for gold.
 * Turn-based, 2 players (anyone else watches); a bot commander plays the other side when you're alone.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ the map, units, damage table, terrain, gold, days, timers
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   MAP ........... reading the map: terrain, buildings, distances
 *   RULES ......... every action (build, move, attack, capture, wait, end turn) as one function
 *                   that checks it and returns the new game, or null if it isn't allowed
 *   BOT ........... how the bot commander picks its next action
 *   GAME (HOST) ... seats, bot turns, the turn timer, the winner. Only the host writes `game`.
 *   DRAW .......... the map (turned so your side is nearest you), buildings, units, markers, effects
 *   MY TURN ....... selecting units and bases, sending actions
 *   HUD & RESULTS . the top bar, the action panel, turn banners, results card, leaderboard, sounds
 *   INPUT / LOOP .. taps and keys, the main loop
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The whole battle lives in ONE shared field, `game`: {id, v, seats, turn, day, tt, t, gold,
 *     own, cap, u, nid, phase, win, why, at, endsAt, last}. `own` is one letter per building
 *     ("a" blue, "b" red, "-" nobody); `u` lists the units [id, side, type, x, y, hp, state]
 *     (state 0 ready, 1 moved, 2 done). Only the HOST writes it; `v` goes up on every write.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. It checks every action with the RULES, plays the bot commander
 *     one action at a time, ends a turn when its timer runs out and decides the winner. A new
 *     host carries on from `game`: same units, same turn, same timer.
 *   - Each player writes its OWN entity: `n` (name), `c` (color), `hb` (heartbeat).
 *   - Players send intents to the host: "act" {g, tt, a} with a = {k: "build"|"move"|"attack"|
 *     "capture"|"wait"|"end", ...}; `tt` counts turns, so an action from an old turn is
 *     ignored. "again" {g} after a battle. The host applies its own actions directly.
 *   - Everyone animates from `last` (the newest action: the path a unit drove, who hit whom).
 *   - The first two players take the sides; anyone else watches. A side whose player is silent
 *     for 10s goes to the bot, and a waiting player takes over the bot's side, even mid-battle.
 *   - ?attract plays offline, bot against bot, a few days in (the preview is recorded from it).
 *   - Leaderboard "wins": +1 for each battle a player wins, shown on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  // The map, row by row. Terrain: . plains  % forest  ^ mountain  ~ river  = road  # bridge.
  // Buildings: H/h HQ, B/b base (builds units), C/c city; capitals = blue (left), lowercase = red (right), o = nobody's city.
  map: [
    "%..o..~.^.%..",
    ".H==B=#...o.%",
    ".=.%..~...^..",
    "C=..^.~o.%.b.",
    ".=====#=====.",
    ".B.%.o~.^..=c",
    "..^...~..%.=.",
    "%.o...#=b==h.",
    "..%.^.~..o..%",
  ],
  days: 20,              // after this many days the side with more buildings wins
  turnMs: 60000,         // a turn ends by itself after this long
  botStepMs: 420,        // the bot commander waits this long between actions
  stepMs: 95,            // a unit takes this long to drive one tile
  fightMs: 700,          // the pause after a shot, so everyone sees the hit and the reply
  income: 100,           // gold per owned building at the start of each turn
  secondBonus: 600,      // red moves second, so it starts with this much extra gold
  maxUnits: 12,          // units per side
  heal: 2,               // HP a unit gets back at the start of its turn on one of its side's buildings
  capturePoints: 20,     // a building's strength; each capture takes away the infantry's HP
  // move = movement points; range = [min, max] tiles; indirect units can't move and fire in one turn, and never hit back
  units: [
    { name: "Infantry", cost: 100, move: 3, range: [1, 1], capture: true },
    { name: "Tank", cost: 400, move: 5, range: [1, 1] },
    { name: "Artillery", cost: 300, move: 4, range: [2, 3], indirect: true },
  ],
  // Damage to a full-health target from a full-health attacker, in HP (units have 10).
  // Rows: attacker infantry, tank, artillery. Columns: target infantry, tank, artillery.
  damage: [[5.5, 1, 1.5], [7.5, 5.5, 7], [9, 7, 7.5]],
  // def = defense stars (each takes 10% off damage); cost = movement points for infantry, tank, artillery (99 = can't)
  terrain: {
    ".": { name: "Plains", def: 1, cost: [1, 1, 1] },
    "%": { name: "Forest", def: 2, cost: [1, 2, 2] },
    "^": { name: "Mountain", def: 4, cost: [2, 99, 99] },
    "~": { name: "River", def: 0, cost: [99, 99, 99] },
    "=": { name: "Road", def: 0, cost: [1, 1, 1] },
    "#": { name: "Bridge", def: 0, cost: [1, 1, 1] },
    B: { name: "Building", def: 3, cost: [1, 1, 1] },
  },
  seatGraceMs: 10000,    // a player silent this long hands the side to the bot
  resultsMs: 40000,      // results show this long, then a new battle starts
  board: "wins",         // leaderboard name
  sides: [{ name: "Blue", color: "#3d8bfd", dark: "#1d4ea6" }, { name: "Red", color: "#ff4d5e", dark: "#a5202e" }],
  botName: "Commander Bolt",
};
const COLORS = ["#ffd166", "#4fc3f7", "#81c784", "#ff8a65", "#ba68c8", "#f06292", "#4dd0e1", "#aed581"];
const NAME_A = ["Major", "Captain", "General", "Colonel", "Sergeant", "Marshal"], NAME_B = ["Maple", "Flint", "Pepper", "Badger", "Comet", "Juniper"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'grid-tactics',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
/** Still in the room and heard from within the seat grace time (a backgrounded phone keeps its seat). */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── MAP ─────────────────────────────────────────────────────────────────────────────
// Tiles are (x, y): x 0..MW-1 left to right (blue's side first), y 0..MH-1 top to bottom.
const MAP = CONFIG.map, MW = MAP[0].length, MH = MAP.length;
const BUILDINGS = []; // { x, y, kind: "hq" | "base" | "city", start: 0 blue, 1 red, -1 nobody }
const BGRID = MAP.map((row, y) => [...row].map((ch, x) => {
  if (!"HhBbCco".includes(ch)) return -1;
  const kind = ch === "o" ? "city" : { h: "hq", b: "base", c: "city" }[ch.toLowerCase()];
  BUILDINGS.push({ x, y, kind, start: ch === "o" ? -1 : ch === ch.toUpperCase() ? 0 : 1 });
  return BUILDINGS.length - 1;
}));
const bAt = (x, y) => (x >= 0 && y >= 0 && x < MW && y < MH ? BGRID[y][x] : -1);
const inMap = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH;
const terrainAt = (x, y) => (bAt(x, y) >= 0 ? CONFIG.terrain.B : CONFIG.terrain[MAP[y][x]]);
const stars = (x, y) => (bAt(x, y) >= 0 && BUILDINGS[bAt(x, y)].kind === "hq" ? 4 : terrainAt(x, y).def);
const dist = (ax, ay, bx, by) => Math.abs(ax - bx) + Math.abs(ay - by);
const DIR4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const CH = "ab"; // owner letters in `own`

// ── RULES ───────────────────────────────────────────────────────────────────────────
const unitAt = (x, X, Y) => x.u.find((u) => u[3] === X && u[4] === Y);
const unitsOf = (x, s) => x.u.filter((u) => u[1] === s);
const owned = (x, s) => [...x.own].filter((c) => c === CH[s]).length;
/** Damage `a` (type, hp) does to a unit of type `dt` standing on (X, Y): the table, scaled by the attacker's HP and the target's cover. */
const damage = (at, ahp, dt, X, Y) => Math.max(1, Math.round(CONFIG.damage[at][dt] * (ahp / 10) * (1 - 0.1 * stars(X, Y))));
/** Tiles a unit can drive to this turn: "x,y" -> path [[x, y], ...]. Through its own units (not stopping on them), never through enemies. */
function reachable(x, u) {
  const out = new Map(), best = new Map([[u[3] + "," + u[4], 0]]), queue = [[u[3], u[4], 0, []]], mv = CONFIG.units[u[2]].move;
  while (queue.length) {
    queue.sort((a, b) => a[2] - b[2]);
    const [cx, cy, c, path] = queue.shift();
    for (const [dx, dy] of DIR4) {
      const nx = cx + dx, ny = cy + dy;
      if (!inMap(nx, ny)) continue;
      const nc = c + terrainAt(nx, ny).cost[u[2]], k = nx + "," + ny, o = unitAt(x, nx, ny);
      if (nc > mv || (o && o[1] !== u[1]) || (best.has(k) && best.get(k) <= nc)) continue;
      best.set(k, nc);
      const p = [...path, [nx, ny]];
      if (!o) out.set(k, p);
      queue.push([nx, ny, nc, p]);
    }
  }
  return out;
}
/** Enemy units a unit could fire at from (X, Y). */
function targetsFrom(x, u, X, Y) {
  const [lo, hi] = CONFIG.units[u[2]].range;
  return x.u.filter((e) => e[1] !== u[1] && dist(X, Y, e[3], e[4]) >= lo && dist(X, Y, e[3], e[4]) <= hi);
}
const canFire = (u) => u[6] === 0 || (u[6] === 1 && !CONFIG.units[u[2]].indirect);
const canCapture = (x, u) => CONFIG.units[u[2]].capture && u[6] < 2 && bAt(u[3], u[4]) >= 0 && x.own[bAt(u[3], u[4])] !== CH[u[1]];
const copy = (g) => ({ ...g, own: g.own.split(""), u: g.u.map((u) => u.slice()), gold: g.gold.slice(), cap: { ...g.cap } });
const done = (x) => ({ ...x, own: x.own.join("") });
function finish(x, win, why) { Object.assign(x, { phase: "over", win, why, endsAt: Date.now() + CONFIG.resultsMs }); }
/** Begin side s's turn: income, heal on own buildings, every unit ready, half-done captures dropped if the infantry left. */
function startTurn(x, s) {
  x.turn = s; x.tt++;
  if (s === 0) x.day++;
  const inc = owned(x, s) * CONFIG.income;
  x.gold[s] += inc;
  for (const u of x.u) if (u[1] === s) { u[6] = 0; const b = bAt(u[3], u[4]); if (b >= 0 && x.own[b] === CH[s]) u[5] = Math.min(10, u[5] + CONFIG.heal); }
  for (const b of Object.keys(x.cap)) { const B = BUILDINGS[b], on = unitAt(x, B.x, B.y); if (!on || on[1] !== x.cap[b][1]) delete x.cap[b]; }
  const now = Date.now();
  x.endsAt = now + CONFIG.turnMs; x.at = now + 900;
  x.last = { n: x.last.n + 1, k: "turn", s, inc };
}
function endTurn(x) {
  if (x.turn === 1 && x.day >= CONFIG.days) {
    const sc = (s) => owned(x, s) * 1000 + unitsOf(x, s).reduce((n, u) => n + CONFIG.units[u[2]].cost * u[5] / 10, 0);
    const w = sc(0) === sc(1) ? -1 : sc(0) > sc(1) ? 0 : 1;
    finish(x, w, w < 0 ? `Dead even after ${CONFIG.days} days` : `More buildings after ${CONFIG.days} days`);
    x.last = { n: x.last.n + 1, k: "end" };
    return;
  }
  startTurn(x, 1 - x.turn);
}
/** Try one action for the side whose turn it is. Returns the new game, or null if it isn't allowed. */
function applyAction(g, a) {
  if (!g || g.phase !== "play" || !a || typeof a.k !== "string") return null;
  const x = copy(g), s = g.turn, foe = 1 - s;
  const X = Number.isInteger(a.x) ? a.x : -1, Y = Number.isInteger(a.y) ? a.y : -1;
  const u = x.u.find((v) => v[0] === a.id && v[1] === s);
  let last = null, busyMs = 300;
  if (a.k === "end") { endTurn(x); return done({ ...x, t: g.t + 1 }); }
  if (a.k === "build") {
    const b = bAt(X, Y), type = [0, 1, 2].includes(a.type) ? a.type : -1, U = CONFIG.units[type];
    if (b < 0 || BUILDINGS[b].kind !== "base" || x.own[b] !== CH[s] || !U || unitAt(x, X, Y) || x.gold[s] < U.cost || unitsOf(x, s).length >= CONFIG.maxUnits) return null;
    x.gold[s] -= U.cost;
    x.u.push([x.nid++, s, type, X, Y, 10, 2]); // ready next turn
    last = { k: "build", id: x.nid - 1, x: X, y: Y };
  } else if (a.k === "move") {
    const path = u && u[6] === 0 ? reachable(x, u).get(X + "," + Y) : null;
    if (!path) return null;
    u[3] = X; u[4] = Y; u[6] = 1;
    last = { k: "move", id: u[0], path };
    busyMs = path.length * CONFIG.stepMs + 150;
  } else if (a.k === "attack") {
    const e = u && canFire(u) && targetsFrom(x, u, u[3], u[4]).find((v) => v[3] === X && v[4] === Y);
    if (!e) return null;
    const d = damage(u[2], u[5], e[2], X, Y);
    e[5] -= d; last = { k: "attack", id: u[0], from: [u[3], u[4]], x: X, y: Y, d, kill: 0, back: 0 };
    if (e[5] <= 0) { x.u = x.u.filter((v) => v !== e); last.kill = 1; }
    else if (!CONFIG.units[e[2]].indirect && dist(u[3], u[4], X, Y) === 1) { // a direct unit that survives hits back
      const c = damage(e[2], e[5], u[2], u[3], u[4]);
      u[5] -= c; last.back = c;
      if (u[5] <= 0) { x.u = x.u.filter((v) => v !== u); last.lost = 1; }
    }
    u[6] = 2; busyMs = CONFIG.fightMs;
    if (!unitsOf(x, foe).length && x.day >= 3) finish(x, s, `${CONFIG.sides[foe].name}'s army was wiped out`);
    if (!unitsOf(x, s).length && x.day >= 3) finish(x, foe, `${CONFIG.sides[s].name}'s army was wiped out`);
  } else if (a.k === "capture") {
    if (!u || !canCapture(x, u)) return null;
    const b = bAt(u[3], u[4]), left = (x.cap[b] && x.cap[b][1] === s ? x.cap[b][0] : CONFIG.capturePoints) - u[5];
    u[6] = 2;
    if (left > 0) { x.cap[b] = [left, s]; last = { k: "capture", id: u[0], b, left }; }
    else {
      delete x.cap[b]; x.own[b] = CH[s]; last = { k: "capture", id: u[0], b, left: 0 };
      if (BUILDINGS[b].kind === "hq") finish(x, s, `${CONFIG.sides[s].name} took the enemy HQ`);
    }
  } else if (a.k === "wait") {
    if (!u || u[6] === 2) return null;
    u[6] = 2; last = { k: "wait", id: u[0] }; busyMs = 120;
  } else return null;
  x.t = g.t + 1; x.at = Date.now() + busyMs;
  x.last = { n: g.last.n + 1, s, ...last };
  return done(x);
}

// ── BOT ─────────────────────────────────────────────────────────────────────────────
/** How good a hit is: damage dealt (in gold) minus the damage taken back, plus a big bonus for a kill. */
function hitValue(x, u, X, Y, e) {
  const d = Math.min(e[5], damage(u[2], u[5], e[2], e[3], e[4])), left = e[5] - d;

  net.on("act", (m, from) => { if (isHost() && m) hostAct(from, m); });
  net.on("again", (m, from) => { if (isHost() && m) hostAgain(from, m); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const takenColors = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !takenColors.has(c)) || pickOne(COLORS);
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
